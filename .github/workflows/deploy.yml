name: Build sitemap and deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://example.com' }}
        run: |
          echo '<?xml version="1.0" encoding="UTF-8"?>' > sitemap.xml
          echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">' >> sitemap.xml
          find . -name "*.html" \
            -not -name "_template.html" \
            -not -path "./.github/*" \
          | sed 's|^\./||' \
          | sort \
          | while read -r f; do
              if [ "$f" = "index.html" ]; then
                url="$SITE_URL/"
              else
                url="$SITE_URL/$f"
              fi
              echo "  <url><loc>${url}</loc></url>" >> sitemap.xml
            done
          echo '</urlset>' >> sitemap.xml

      - name: Commit sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- sitemap.xml; then
            git add sitemap.xml
            git commit -m "chore: update sitemap.xml [skip ci]"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
